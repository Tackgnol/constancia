# Runs on the integration branch. Lighter than PR checks.

when:
  - event: push
    branch: dev

steps:
  workspace-checks:
    image: node:22.23.4-bookworm
    environment:
      # GitHub Packages token for @tackgnol/* (rpg-tools-roller); same secret scvmrack uses.
      NPMRC_CONTENT:
        from_secret: npmrc_content
    commands:
      - printf '%s\n' "$NPMRC_CONTENT" >> .npmrc
      - npm ci --no-audit --no-fund
      - npm run typecheck
      - npm run test
