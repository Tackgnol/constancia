# Deploys master only. Secrets/config to create in Woodpecker:
#
# Required for a full production deploy:
#   postgres_password
#   better_auth_secret
#   bot_api_key
#   frontend_url
#   better_auth_url
#   backend_public_url
#   discord_token
#   discord_client_id
#   superuser_email
#   superuser_discord_id
#
# Optional (only when enabling the corresponding feature):
#   superuser_name              # Defaults to "Constancia Superuser"
#   superuser_upload_allowance_bytes
#   discord_client_secret      # Better Auth Discord OAuth in the backend/frontend
#   discord_guild_id           # Faster per-guild slash-command registration
#   openai_api_key             # Required when CONTENT_MODERATION_ENABLED=true
#   upload_public_base_url     # Public R2/custom-domain prefix for direct object serving.
#                              # Re-add the secret AND its from_secret entries in both steps
#                              # below when enabling; Woodpecker fails on missing secrets.
#   r2_endpoint                # Required when UPLOAD_STORAGE_DRIVER=r2
#   r2_access_key_id           #   "
#   r2_secret_access_key       #   "
#   r2_bucket                  #   "
#
# Non-secret defaults baked into this pipeline (see env.production.example
# for the full list of toggles):
#   POSTGRES_DB=constancia
#   POSTGRES_USER=constancia
#   FRONTEND_PORT=3020                # Caddy constancia.rpgtools.co frontend target
#   BACKEND_PORT=3021                 # Caddy constancia.rpgtools.co auth/API target
#   VITE_DISCORD_AUTH_ENABLED=false
#   CONTENT_MODERATION_ENABLED=true
#   UPLOAD_STORAGE_DRIVER=r2

when:
  - event: push
    branch: master

steps:
  build:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      COMPOSE_PROJECT_NAME: constancia
      POSTGRES_DB: constancia
      POSTGRES_USER: constancia
      FRONTEND_PORT: '3020'
      BACKEND_PORT: '3021'
      VITE_DISCORD_AUTH_ENABLED: 'false'
      CONTENT_MODERATION_ENABLED: 'true'
      CONTENT_MODERATION_FAIL_CLOSED: 'false'
      UPLOAD_STORAGE_DRIVER: r2
      POSTGRES_PASSWORD:
        from_secret: postgres_password
      BETTER_AUTH_SECRET:
        from_secret: better_auth_secret
      BOT_API_KEY:
        from_secret: bot_api_key
      FRONTEND_URL:
        from_secret: frontend_url
      BETTER_AUTH_URL:
        from_secret: better_auth_url
      BACKEND_PUBLIC_URL:
        from_secret: backend_public_url
      DISCORD_TOKEN:
        from_secret: discord_token
      DISCORD_CLIENT_ID:
        from_secret: discord_client_id
      SUPERUSER_EMAIL:
        from_secret: superuser_email
      SUPERUSER_DISCORD_ID:
        from_secret: superuser_discord_id
      SUPERUSER_NAME:
        from_secret: superuser_name
      SUPERUSER_UPLOAD_ALLOWANCE_BYTES:
        from_secret: superuser_upload_allowance_bytes
      OPENAI_API_KEY:
        from_secret: openai_api_key
      R2_ENDPOINT:
        from_secret: r2_endpoint
      R2_ACCESS_KEY_ID:
        from_secret: r2_access_key_id
      R2_SECRET_ACCESS_KEY:
        from_secret: r2_secret_access_key
      R2_BUCKET:
        from_secret: r2_bucket
    commands:
      - |
        set -e

        deployment_tag="${CI_COMMIT_SHA:-local}-${CI_PIPELINE_NUMBER:-0}"
        export BACKEND_IMAGE="constancia-backend:$deployment_tag"
        export FRONTEND_IMAGE="constancia-frontend:$deployment_tag"
        export BOT_IMAGE="constancia-bot:$deployment_tag"
        export MIGRATE_IMAGE="constancia-migrate:$deployment_tag"

        # POSTGRES_PASSWORD_URLENCODED is required by compose.prod.yaml for DATABASE_URL.
        # The raw password is sufficient for structural config validation here
        # (no actual DB connection is made). The deploy step computes the proper
        # URL-encoded value using Node.js before running docker stack deploy.
        POSTGRES_PASSWORD_URLENCODED="$POSTGRES_PASSWORD"
        export POSTGRES_PASSWORD_URLENCODED

        docker compose -f compose.prod.yaml config > /dev/null
        docker compose -f compose.prod.yaml config --format json | grep -q '"published": "3020"'
        docker compose -f compose.prod.yaml config --format json | grep -q '"published": "3021"'
        echo "Config validation passed"

        docker compose -f compose.prod.yaml build backend frontend bot migrate
        docker image inspect "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$BOT_IMAGE" "$MIGRATE_IMAGE" > /dev/null
        echo "All images built for deployment $deployment_tag"

  deploy:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      COMPOSE_PROJECT_NAME: constancia
      POSTGRES_DB: constancia
      POSTGRES_USER: constancia
      FRONTEND_PORT: '3020'
      BACKEND_PORT: '3021'
      VITE_DISCORD_AUTH_ENABLED: 'false'
      CONTENT_MODERATION_ENABLED: 'true'
      CONTENT_MODERATION_FAIL_CLOSED: 'false'
      UPLOAD_STORAGE_DRIVER: r2
      POSTGRES_PASSWORD:
        from_secret: postgres_password
      BETTER_AUTH_SECRET:
        from_secret: better_auth_secret
      BOT_API_KEY:
        from_secret: bot_api_key
      FRONTEND_URL:
        from_secret: frontend_url
      BETTER_AUTH_URL:
        from_secret: better_auth_url
      BACKEND_PUBLIC_URL:
        from_secret: backend_public_url
      DISCORD_TOKEN:
        from_secret: discord_token
      DISCORD_CLIENT_ID:
        from_secret: discord_client_id
      SUPERUSER_EMAIL:
        from_secret: superuser_email
      SUPERUSER_DISCORD_ID:
        from_secret: superuser_discord_id
      SUPERUSER_NAME:
        from_secret: superuser_name
      SUPERUSER_UPLOAD_ALLOWANCE_BYTES:
        from_secret: superuser_upload_allowance_bytes
      OPENAI_API_KEY:
        from_secret: openai_api_key
      R2_ENDPOINT:
        from_secret: r2_endpoint
      R2_ACCESS_KEY_ID:
        from_secret: r2_access_key_id
      R2_SECRET_ACCESS_KEY:
        from_secret: r2_secret_access_key
      R2_BUCKET:
        from_secret: r2_bucket
    commands:
      - |
        set -e
        set +x

        print_diagnostics() {
          exit_code=$?
          if [ "$exit_code" -eq 0 ]; then
            return
          fi

          echo "Deployment failed with exit code $exit_code" >&2
          echo "=== docker stack ps ===" >&2
          docker stack ps constancia --no-trunc >&2 || true
          echo "=== backend health ===" >&2
          docker ps --filter label=com.docker.swarm.service.name=constancia_backend --format '{{.ID}}' | head -n 1 | xargs -r docker inspect --format '{{json .State.Health}}' >&2 || true
          echo "=== backend logs ===" >&2
          docker service logs --tail=200 constancia_backend >&2 || true
          echo "=== frontend logs ===" >&2
          docker service logs --tail=120 constancia_frontend >&2 || true
        }

        trap print_diagnostics EXIT

        require_env() {
          if [ -z "$(printenv "$1")" ]; then
            echo "Missing required deployment environment variable: $1" >&2
            exit 1
          fi
        }

        require_url() {
          require_env "$1"
          case "$(printenv "$1")" in
            http://*|https://*) ;;
            *)
              echo "$1 must be a full URL including http:// or https://" >&2
              exit 1
              ;;
          esac
        }

        require_url FRONTEND_URL
        require_url BETTER_AUTH_URL
        require_url BACKEND_PUBLIC_URL
        require_env POSTGRES_PASSWORD
        require_env SUPERUSER_EMAIL
        require_env SUPERUSER_DISCORD_ID

        if [ -n "$UPLOAD_PUBLIC_BASE_URL" ]; then
          require_url UPLOAD_PUBLIC_BASE_URL
        fi

        if [ "$CONTENT_MODERATION_ENABLED" = "true" ]; then
          require_env OPENAI_API_KEY
        fi

        if [ "$UPLOAD_STORAGE_DRIVER" = "r2" ]; then
          require_env R2_ENDPOINT
          require_env R2_ACCESS_KEY_ID
          require_env R2_SECRET_ACCESS_KEY
          require_env R2_BUCKET
        fi

        deployment_tag="${CI_COMMIT_SHA:-local}-${CI_PIPELINE_NUMBER:-0}"
        export BACKEND_IMAGE="constancia-backend:$deployment_tag"
        export FRONTEND_IMAGE="constancia-frontend:$deployment_tag"
        export BOT_IMAGE="constancia-bot:$deployment_tag"
        export MIGRATE_IMAGE="constancia-migrate:$deployment_tag"

        docker image inspect "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$BOT_IMAGE" "$MIGRATE_IMAGE" > /dev/null
        echo "Deploying immutable images for $deployment_tag"

        # URL-encode the password using Node.js from the already-built backend image
        # (reliable across all environments; avoids busybox shell encoding issues)
        echo "Encoding postgres password..."
        POSTGRES_PASSWORD_URLENCODED="$(docker run --rm \
          -e RAW_PASS="$POSTGRES_PASSWORD" \
          "$BACKEND_IMAGE" \
          node -e 'process.stdout.write(encodeURIComponent(process.env.RAW_PASS))')"
        if [ -z "$POSTGRES_PASSWORD_URLENCODED" ]; then
          echo "Failed to URL-encode POSTGRES_PASSWORD" >&2
          exit 1
        fi
        export POSTGRES_PASSWORD_URLENCODED
        echo "Password encoded"

        if ! docker service inspect constancia_postgres > /dev/null 2>&1; then
          echo "Bootstrapping postgres service..."
          docker compose -f compose.prod.yaml down --remove-orphans || true
          BACKEND_REPLICAS=0 FRONTEND_REPLICAS=0 BOT_REPLICAS=0 \
            docker stack deploy -c compose.prod.yaml constancia --detach=true --resolve-image never
        fi

        wait_for_service_health() {
          service="$1"
          deadline=$(( $(date +%s) + 180 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            container_id="$(docker ps --filter label=com.docker.swarm.service.name="$service" --format '{{.ID}}' | head -n 1)"
            if [ -n "$container_id" ]; then
              health="$(docker inspect "$container_id" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' 2>/dev/null || true)"
              echo "Waiting for $service health: $health"
              if [ "$health" = "healthy" ]; then
                return 0
              fi
            fi
            sleep 3
          done

          echo "Timed out waiting for $service to become healthy" >&2
          return 1
        }

        wait_for_service_health constancia_postgres

        sync_postgres_password() {
          postgres_container_id="$(docker ps --filter label=com.docker.swarm.service.name=constancia_postgres --format '{{.ID}}' | head -n 1)"
          if [ -z "$postgres_container_id" ]; then
            echo "Could not find running constancia_postgres container" >&2
            return 1
          fi

          docker exec \
            -u postgres \
            -e POSTGRES_DB="${POSTGRES_DB:-constancia}" \
            -e POSTGRES_USER="${POSTGRES_USER:-constancia}" \
            -e NEW_PG_PASSWORD="$POSTGRES_PASSWORD" \
            "$postgres_container_id" \
            sh -c 'printf "ALTER USER %s WITH PASSWORD '\''%s'\'';\n" "$(printf "%s" "$POSTGRES_USER" | sed "s/\"/\"\"/g")" "$(printf "%s" "$NEW_PG_PASSWORD" | sed "s/'\''/'\'''\''/g")" | psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1'
        }

        sync_postgres_password

        docker run --rm --network constancia_db \
          -e PGPASSWORD="$POSTGRES_PASSWORD" \
          postgres:17-alpine \
          psql -h constancia_postgres -U "${POSTGRES_USER:-constancia}" -d "${POSTGRES_DB:-constancia}" -v ON_ERROR_STOP=1 -c 'select 1' > /dev/null
        echo "Postgres connectivity verified"

        # Pass vars by name (-e NAME) so Docker reads values straight from the
        # environment. Never inline "$VAR" into argv: a secret containing a
        # space/quote/newline would otherwise split the arg list and leave a
        # bare -e ("flag needs an argument: 'e' in -e").
        docker run --rm --network constancia_db \
          -e POSTGRES_PASSWORD \
          -e POSTGRES_USER \
          -e PGHOST="constancia_postgres" \
          -e POSTGRES_DB \
          -e SUPERUSER_EMAIL \
          -e SUPERUSER_DISCORD_ID \
          -e SUPERUSER_NAME \
          -e SUPERUSER_UPLOAD_ALLOWANCE_BYTES \
          "$MIGRATE_IMAGE"
        echo "Migrations complete"

        docker stack deploy -c compose.prod.yaml constancia --detach=false --resolve-image never

        # A unique tag changes the Swarm task template on every deployment.
        # Verify the actual image id of each running container as well, so a
        # green pipeline can never silently leave the previous build serving.
        verify_service_image() {
          service="$1"
          image="$2"
          expected_id="$(docker image inspect --format '{{.Id}}' "$image")"
          deadline=$(( $(date +%s) + 180 ))

          while [ "$(date +%s)" -lt "$deadline" ]; do
            container_ids="$(docker ps --filter label=com.docker.swarm.service.name="$service" --format '{{.ID}}')"
            all_match=true
            running_count=0

            for container_id in $container_ids; do
              running_count=$((running_count + 1))
              actual_id="$(docker inspect --format '{{.Image}}' "$container_id" 2>/dev/null || true)"
              if [ "$actual_id" != "$expected_id" ]; then
                all_match=false
                echo "$service container $container_id is using $actual_id; expected $expected_id"
              fi
            done

            if [ "$running_count" -gt 0 ] && [ "$all_match" = "true" ]; then
              service_image="$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "$service")"
              echo "$service verified on $service_image ($expected_id)"
              return 0
            fi

            sleep 3
          done

          echo "Timed out verifying $service is running $image" >&2
          return 1
        }

        docker service update --image "$BACKEND_IMAGE" --no-resolve-image --detach=false constancia_backend
        wait_for_service_health constancia_backend
        verify_service_image constancia_backend "$BACKEND_IMAGE"

        docker service update --image "$FRONTEND_IMAGE" --no-resolve-image --detach=false constancia_frontend
        wait_for_service_health constancia_frontend
        verify_service_image constancia_frontend "$FRONTEND_IMAGE"

        docker service update --image "$BOT_IMAGE" --no-resolve-image --detach=false constancia_bot
        verify_service_image constancia_bot "$BOT_IMAGE"

        docker stack services constancia
        docker service ps constancia_backend --no-trunc
        docker service ps constancia_frontend --no-trunc
        docker service ps constancia_bot --no-trunc
        docker image prune -f
