# Deploys master only. Secrets/config to create in Woodpecker (repo scoped):
#
# Required for a full production deploy:
#   postgres_password
#   better_auth_secret
#   bot_api_key
#   frontend_url
#   better_auth_url
#   backend_public_url
#   discord_token
#   discord_client_id
#
# Optional (only when enabling the corresponding feature):
#   discord_client_secret      # Better Auth Discord OAuth in the backend/frontend
#   discord_guild_id           # Faster per-guild slash-command registration
#   openai_api_key             # Required when CONTENT_MODERATION_ENABLED=true
#   upload_public_base_url     # Public URL prefix for local upload files
#   r2_endpoint                # Required when UPLOAD_STORAGE_DRIVER=r2
#   r2_access_key_id           #   "
#   r2_secret_access_key       #   "
#   r2_bucket                  #   "
#
# Non-secret defaults baked into this pipeline (see env.production.example
# for the full list of toggles):
#   POSTGRES_DB=constancia
#   POSTGRES_USER=constancia
#   FRONTEND_PORT=3010                # host loopback port; Caddy → localhost:3010
#   BACKEND_PORT=3011                 # host loopback port; Caddy → localhost:3011
#   VITE_DISCORD_AUTH_ENABLED=false
#   CONTENT_MODERATION_ENABLED=true
#   UPLOAD_STORAGE_DRIVER=r2

when:
  - event: push
    branch: master

steps:
  deploy:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      COMPOSE_PROJECT_NAME: constancia
      POSTGRES_DB: constancia
      POSTGRES_USER: constancia
      FRONTEND_PORT: '3010'
      BACKEND_PORT: '3011'
      VITE_DISCORD_AUTH_ENABLED: 'false'
      CONTENT_MODERATION_ENABLED: 'true'
      CONTENT_MODERATION_FAIL_CLOSED: 'false'
      UPLOAD_STORAGE_DRIVER: r2

      POSTGRES_PASSWORD:
        from_secret: postgres_password
      BETTER_AUTH_SECRET:
        from_secret: better_auth_secret
      BOT_API_KEY:
        from_secret: bot_api_key
      FRONTEND_URL:
        from_secret: frontend_url
      BETTER_AUTH_URL:
        from_secret: better_auth_url
      BACKEND_PUBLIC_URL:
        from_secret: backend_public_url
      DISCORD_TOKEN:
        from_secret: discord_token
      DISCORD_CLIENT_ID:
        from_secret: discord_client_id
      OPENAI_API_KEY:
        from_secret: openai_api_key
      R2_ENDPOINT:
        from_secret: r2_endpoint
      R2_ACCESS_KEY_ID:
        from_secret: r2_access_key_id
      R2_SECRET_ACCESS_KEY:
        from_secret: r2_secret_access_key
      R2_BUCKET:
        from_secret: r2_bucket
      UPLOAD_PUBLIC_BASE_URL:
        from_secret: upload_public_base_url
    commands:
      - |
        set -e

        print_diagnostics() {
          exit_code=$?
          if [ "$exit_code" -eq 0 ]; then
            return
          fi

          echo "Deployment failed with exit code $exit_code" >&2
          echo "=== docker compose ps ===" >&2
          docker compose -f compose.prod.yaml ps >&2 || true
          echo "=== backend health ===" >&2
          docker inspect constancia-backend-1 --format '{{json .State.Health}}' >&2 || true
          echo "=== backend logs ===" >&2
          docker compose -f compose.prod.yaml logs --no-color --tail=200 backend >&2 || true
          echo "=== frontend logs ===" >&2
          docker compose -f compose.prod.yaml logs --no-color --tail=120 frontend >&2 || true
        }

        trap print_diagnostics EXIT

        require_env() {
          if [ -z "$(printenv "$1")" ]; then
            echo "Missing required deployment environment variable: $1" >&2
            exit 1
          fi
        }

        require_url() {
          require_env "$1"
          case "$(printenv "$1")" in
            http://*|https://*) ;;
            *)
              echo "$1 must be a full URL including http:// or https://" >&2
              exit 1
              ;;
          esac
        }

        require_url FRONTEND_URL
        require_url BETTER_AUTH_URL
        require_url BACKEND_PUBLIC_URL

        if [ -n "$UPLOAD_PUBLIC_BASE_URL" ]; then
          require_url UPLOAD_PUBLIC_BASE_URL
        fi

        if [ "$CONTENT_MODERATION_ENABLED" = "true" ]; then
          require_env OPENAI_API_KEY
        fi

        if [ "$UPLOAD_STORAGE_DRIVER" = "r2" ]; then
          require_env R2_ENDPOINT
          require_env R2_ACCESS_KEY_ID
          require_env R2_SECRET_ACCESS_KEY
          require_env R2_BUCKET
        fi

        docker compose -f compose.prod.yaml config > /dev/null
        docker compose -f compose.prod.yaml config --format json | grep -q '"published": "3010"'
        docker compose -f compose.prod.yaml config --format json | grep -q '"published": "3011"'

        docker compose -f compose.prod.yaml build backend frontend bot migrate
        docker compose -f compose.prod.yaml up -d --wait postgres
        docker compose -f compose.prod.yaml run --rm --no-deps migrate
        docker compose -f compose.prod.yaml up -d --wait --force-recreate backend frontend
        docker compose -f compose.prod.yaml port frontend 3000 | grep -q '127.0.0.1:3010'
        docker compose -f compose.prod.yaml port backend 3000 | grep -q '127.0.0.1:3011'
        docker compose -f compose.prod.yaml up -d bot
        docker compose -f compose.prod.yaml ps
        docker image prune -f
